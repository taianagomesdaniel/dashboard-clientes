<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Dashboard Clientes</title>
  </head>
  <body>
    <header>
      <h1>Dashboard de Clientes</h1>
      <p><span id="operador"></span></p>
    </header>

    <main>
      <section>
        <form id="cadastro-cliente">
          <h2>Cadastro de Cliente</h2>
          <label for="nome-cliente">Nome:</label>
          <input type="text" id="nome-cliente" name="nome" required />
          <br />
          <label for="email">Email:</label>
          <input type="email" id="email-cliente" name="email" required />
          <br />
          <br />
          <label for="cep">CEP:</label>
          <input type="text" id="cep" name="cep" required />
          <br />
          <br />
          <label for="logradouro">Logradouro:</label>
          <input type="text" id="logradouro" name="logradouro" readonly />
          <br />
          <br />
          <label for="numero">Número:</label>
          <input type="text" id="numero" name="numero" required />
          <br />
          <br />
          <label for="bairro">Bairro:</label>
          <input type="text" id="bairro" name="bairro" readonly />
          <br />
          <br />
          <label for="cidade">Cidade:</label>
          <input type="text" id="cidade" name="cidade" readonly />
          <br />
          <br />
          <label for="uf">UF:</label>
          <input type="text" id="uf" name="uf" readonly />
          <br />
          <label for="plano">Escolha um plano:</label>
          <select id="plano" name="plano" required>
            <option value="">Selecione um plano</option>
            <option value="bronze">Bronze</option>
            <option value="prata">Prata</option>
            <option value="ouro">Ouro</option>
          </select>
          <br />
          <button type="submit" id="botao-salvar">Cadastrar</button>
        </form>
      </section>

      <section id="filtro-clientes">
        <h2>Filtro de Clientes</h2>
        <label for="campo-busca">Buscar Cliente:</label>
        <input
          type="text"
          id="campo-busca"
          placeholder="Digite o nome do cliente..."
        />
      </section>

      <section id="lista-clientes"></section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
